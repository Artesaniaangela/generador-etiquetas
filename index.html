<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Etiquetas 10x15</title>
    <!-- Librería para garantizar la descarga de la imagen PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
        }

        /* PANEL DE CONTROL */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
        .controls label { font-size: 12px; font-weight: bold; color: #374151; }
        
        .controls input, .controls select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            margin-top: 4px;
        }

        .row { display: flex; gap: 10px; }
        .buttons-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: var(--primary-hover); }
        button.print-btn { background-color: #059669; }
        button.print-btn:hover { background-color: #047857; }

        /* ÁREA DE VISTA PREVIA */
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ETIQUETA EXACTA 150x100mm */
        .label-container {
            width: 150mm;
            height: 100mm;
            background: white;
            padding: 8mm;
            border-radius: 10px;
            border: 3px solid black;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        /* Cabecera de la etiqueta */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            height: 17mm;
            margin-bottom: 1mm;
            overflow: hidden;
        }

        .logo-area {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-area img {
            max-width: 100%;
            max-height: 15mm;
            object-fit: contain;
        }

        .sender-info {
            width: 50%;
            text-align: right;
            font-size: 9px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Título central */
        .title-divider {
            border-top: 2px solid black;
            margin: 0 0 3px 0;
        }

        .title {
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 2px;
            margin: 2px 0 6px 0;
            text-decoration: underline;
        }

        /* Campos de llenado alineados */
        .fields {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .field-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 4px;
        }

        .field-label {
            font-weight: bold;
            font-size: 15px;
            width: 120px; 
            white-space: nowrap;
        }

        .field-value {
            flex-grow: 1;
            border-bottom: 1px solid black;
            min-height: 20px;
            font-size: 17px;
            color: #0021a5;
            font-weight: bold;
            padding-bottom: 2px;
            text-transform: uppercase;
        }

        .depto-container {
            display: flex;
            align-items: flex-end;
            margin-left: 10px;
            min-width: 80px;
        }

        .depto-container .field-label {
            width: auto;
            margin-right: 5px;
        }

        /* CONFIGURACIÓN DE IMPRESIÓN */
        @media print {
            body { background: white; margin: 0; padding: 0; display: block; }
            .controls { display: none; }
            .preview-area { display: block; box-shadow: none; margin: 0; }
            .label-container {
                border: 2px solid black;
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
        }
        @page {
            size: 150mm 100mm;
            margin: 0;
        }
        
        /* Ajuste para celulares */
        @media (max-width: 800px) {
            body { flex-direction: column; align-items: center; }
            .label-container { transform: scale(0.85); transform-origin: top center; margin-bottom: -15mm; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Datos del Envío</h2>

        <div style="flex: 1;">
            <label>RUT</label>
            <input type="text" id="in-rut" oninput="updateLabel()" placeholder="Ej: 12.345.678-9">
        </div>

        <div>
            <label>Destinatario</label>
            <input type="text" id="in-destinatario" oninput="updateLabel()" placeholder="Ej: Juan Pérez">
        </div>

        <div class="row">
            <div style="flex: 1;">
                <label>Teléfono</label>
                <input type="text" id="in-telefono" oninput="updateLabel()" placeholder="+56 9...">
            </div>
            <div style="flex: 1;">
                <label>Ciudad / Comuna</label>
                <input type="text" id="in-ciudad" oninput="updateLabel()" placeholder="Ej: Providencia">
            </div>
        </div>

        <div class="row">
            <div style="flex: 2;">
                <label>Dirección</label>
                <input type="text" id="in-direccion" oninput="updateLabel()" placeholder="Calle y número">
            </div>
            <div style="flex: 1;">
                <label>Depto / N°</label>
                <input type="text" id="in-depto" oninput="updateLabel()" placeholder="Ej: 704">
            </div>
        </div>

        <div class="row">
            <div style="flex: 1;">
                <label>Observaciones</label>
                <input type="text" id="in-observaciones" oninput="updateLabel()" placeholder="Ej: Portón negro">
            </div>
        </div>

        <div>
            <label>Región (Chile)</label>
            <select id="in-region" onchange="updateLabel()">
                <option value="">Seleccione región...</option>
                <option value="Arica y Parinacota">Arica y Parinacota</option>
                <option value="Tarapacá">Tarapacá</option>
                <option value="Antofagasta">Antofagasta</option>
                <option value="Atacama">Atacama</option>
                <option value="Coquimbo">Coquimbo</option>
                <option value="Valparaíso">Valparaíso</option>
                <option value="Metropolitana">Metropolitana</option>
                <option value="O'Higgins">O'Higgins</option>
                <option value="Maule">Maule</option>
                <option value="Ñuble">Ñuble</option>
                <option value="Biobío">Biobío</option>
                <option value="La Araucanía">La Araucanía</option>
                <option value="Los Ríos">Los Ríos</option>
                <option value="Los Lagos">Los Lagos</option>
                <option value="Aysén">Aysén</option>
                <option value="Magallanes">Magallanes</option>
            </select>
        </div>

        <div class="buttons-container">
            <button class="print-btn" onclick="window.print()">🖨️ Imprimir Directo</button>
            <button onclick="downloadImage()">🖼️ Descargar Imagen (.PNG)</button>
            <button onclick="downloadPDF()">📄 Descargar PDF</button>
        </div>
    </div>

        // Exportación de Imagen usando html2canvas
        async function downloadImage() {
            const element = document.getElementById('label-export-area');
            
            // Ocultar temporalmente los bordes sombreados visuales para una impresión limpia
            const originalBoxShadow = element.style.boxShadow;
            const originalBorder = element.style.border;
            element.style.boxShadow = 'none';
            element.style.border = '2px solid black';

            try {
                // Generar el canvas con una escala alta para que el PNG quede nítido
                const canvas = await html2canvas(element, {
                    scale: 3, 
                    useCORS: true,
                    backgroundColor: "#ffffff"
                });
                
                // Forzar la descarga de la imagen
                const link = document.createElement('a');
                link.download = 'Etiqueta_Envio.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                alert('No se pudo generar el PNG. Intenta descargar el PDF en su lugar.');
                console.error(error);
            } finally {
                // Restaurar los estilos visuales en pantalla
                element.style.boxShadow = originalBoxShadow;
                element.style.border = originalBorder;
            }
        }

        // Genera y descarga un PDF localmente, sin librerías ni conexión a Internet.
        async function downloadPDF() {
            try {
                const mm = 72 / 25.4;
                const pageW = 150 * mm, pageH = 100 * mm;
                const ops = [];
                const esc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
                const txt = (s, x, top, size=8, bold=false, color='0 0 0') => {
                    s = String(s ?? '').trim();
                    if (!s) return;
                    ops.push(`${color} rg BT /${bold ? 'F2' : 'F1'} ${size} Tf 1 0 0 1 ${(x*mm).toFixed(2)} ${(pageH-top*mm).toFixed(2)} Tm (${esc(s)}) Tj ET`);
                };
                const line = (x1, y1, x2, y2, width=0.6) => ops.push(`0 0 0 RG ${width} w ${(x1*mm).toFixed(2)} ${(pageH-y1*mm).toFixed(2)} m ${(x2*mm).toFixed(2)} ${(pageH-y2*mm).toFixed(2)} l S`);
                const rect = (x,y,w,h,width=1) => ops.push(`0 0 0 RG ${width} w ${(x*mm).toFixed(2)} ${(pageH-(y+h)*mm).toFixed(2)} ${(w*mm).toFixed(2)} ${(h*mm).toFixed(2)} re S`);
                rect(1.1,1.1,147.8,97.8,0.8);

                let imageObject = null;
                const logo = document.getElementById('logo-preview');
                if (logo && logo.style.display !== 'none' && logo.src) {
                    try {
                        const canvas = document.createElement('canvas');
                        const maxW = 420, maxH = 140;
                        const ratio = Math.min(maxW / (logo.naturalWidth || 1), maxH / (logo.naturalHeight || 1), 1);
                        canvas.width = Math.max(1, Math.round((logo.naturalWidth || 1) * ratio));
                        canvas.height = Math.max(1, Math.round((logo.naturalHeight || 1) * ratio));
                        const cx = canvas.getContext('2d');
                        cx.fillStyle = '#ffffff'; cx.fillRect(0,0,canvas.width,canvas.height);
                        cx.drawImage(logo,0,0,canvas.width,canvas.height);
                        const b64 = canvas.toDataURL('image/jpeg',0.92).split(',')[1];
                        const raw = atob(b64); const bytes = new Uint8Array(raw.length);
                        for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
                        imageObject = {bytes, w:canvas.width, h:canvas.height};
                        ops.push(`q ${(45*mm).toFixed(2)} 0 0 ${(15*mm).toFixed(2)} ${(8*mm).toFixed(2)} ${(pageH-23*mm).toFixed(2)} cm /Im1 Do Q`);
                    } catch(e) { imageObject = null; }
                }
                if (!imageObject) txt('LOGO',8,16,12,true,'0.8 0.8 0.8');

                txt('LUIGGI MAMANI LOPEZ',83,8,6.5,true);
                txt('RUT: 25.807.878-0',83,12,6.5,true);
                txt('SANTO DOMINGO 784 LOCAL 14-24',83,16,5.6,true);
                txt('CEL: +56945081094',83,20,6.5,true);
                txt('LUIGGI01995@GMAIL.COM',83,24,5.8,true);
                line(8,27,142,27,0.8);
                txt('DATOS DE ENVIO',55,33,11,true);
                line(8,36,142,36,0.5);

                const rows = [
                    ['DESTINATARIO:', document.getElementById('in-destinatario').value],
                    ['RUT:', document.getElementById('in-rut').value],
                    ['TELÉFONO:', document.getElementById('in-telefono').value],
                    ['DIRECCIÓN:', document.getElementById('in-direccion').value],
                    ['CIUDAD:', document.getElementById('in-ciudad').value],
                    ['REGIÓN:', document.getElementById('in-region').value],
                    ['OBSERVAC.:', document.getElementById('in-observaciones').value]
                ].filter(([label,value]) => label !== 'RUT:' && label !== 'OBSERVAC.:' ? true : String(value||'').trim() !== '');
                let y = 44;
                for (const [label,value] of rows) {
                    const v = String(value || '').trim().toLocaleUpperCase('es-CL');
                    txt(label,8,y,8.3,true);
                    const valueX = label === 'DESTINATARIO:' ? 42 : (label === 'TELÉFONO:' ? 42 : label === 'DIRECCIÓN:' ? 42 : 42);
                    let maxChars = label === 'DIRECCIÓN:' ? 40 : 48;
                    txt(v.slice(0,maxChars),valueX,y,9.2,true,'0 0.13 0.65');
                    line(valueX,y+1.5,142,y+1.5,0.45);
                    y += 8.3;

                const content = ops.join('\n') + '\n';

                    let out=''; for (let i=0;i<str.length;i++) out += String.fromCharCode(str.charCodeAt(i) <= 255 ? str.charCodeAt(i) : 63); return out;
                };
                const objects = [];
                objects.push('<< /Type /Catalog /Pages 2 0 R >>');
                objects.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
                objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> ${imageObject ? '/XObject << /Im1 6 0 R >>' : ''} >> /Contents ${imageObject ? '7' : '6'} 0 R >>`);
                objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');

                let pdf = '%PDF-1.4\n%âãÏÓ\n'; const offsets=[0];

                const xref = pdf.length;
                pdf += `xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
                for(let i=1;i<offsets.length;i++) pdf += `${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
                pdf += `trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
                const bytes = new Uint8Array(pdf.length);
                for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
                const blob = new Blob([bytes], {type:'application/pdf'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href=url; a.download='Etiqueta_Envio.pdf';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(()=>URL.revokeObjectURL(url),3000);
            } catch (error) {
                alert('No se pudo generar el PDF. Prueba abrir el archivo en Chrome y vuelve a intentarlo.');
                console.error(error);
            }
        }
    </script>
</body>
</html>
